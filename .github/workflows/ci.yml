name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: pnpm typecheck

      - name: Unit tests (vitest run)
        run: pnpm test

      - name: dist/ freshness check
        run: |
          pnpm build
          if ! git diff --exit-code -- dist; then
            echo "::error::dist/ is stale relative to src/. Run 'pnpm build' locally and commit the result."
            exit 1
          fi

      - name: check-ownership (R1 exports map intact, R6 OWNERSHIP.md sync)
        run: node bin/check-ownership.mjs --check
